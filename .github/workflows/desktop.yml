name: Desktop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  PNPM_VERSION: '10.33.0'

jobs:
  desktop:
    name: Check and build desktop bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and pin pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test desktop MCP
        shell: bash
        run: pnpm run check:desktop

      - name: Build desktop web bundle
        shell: bash
        run: pnpm run build:desktop

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yachiyo-claw-desktop-${{ github.run_number }}
          path: dist/renderer
          if-no-files-found: error
          retention-days: 14
